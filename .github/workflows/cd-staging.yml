name: CD Staging

on:
  push:
    branches: [develop]

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: tictactoe-staging-eks

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/tictactoe-backend:${{ steps.sha.outputs.short }}
            ${{ steps.login-ecr.outputs.registry }}/tictactoe-backend:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/tictactoe-frontend:${{ steps.sha.outputs.short }}
            ${{ steps.login-ecr.outputs.registry }}/tictactoe-frontend:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=/api/v1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Deploy to Kubernetes
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          IMAGE_TAG: ${{ steps.sha.outputs.short }}
        run: |
          cd infrastructure/k8s/overlays/staging
          envsubst < kustomization.yaml > kustomization.yaml.tmp
          mv kustomization.yaml.tmp kustomization.yaml
          kubectl apply -k .

      - name: Wait for rollout
        run: |
          kubectl -n tictactoe rollout status deployment/backend --timeout=300s
          kubectl -n tictactoe rollout status deployment/frontend --timeout=300s

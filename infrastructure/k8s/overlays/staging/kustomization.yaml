apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tictactoe

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: backend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: frontend

configMapGenerator:
  - name: app-config
    behavior: replace
    literals:
      - ENV=staging

images:
  - name: BACKEND_IMAGE
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/tictactoe-backend
    newTag: ${IMAGE_TAG}
  - name: FRONTEND_IMAGE
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/tictactoe-frontend
    newTag: ${IMAGE_TAG}

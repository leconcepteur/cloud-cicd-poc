apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tictactoe

resources:
  - ../../base

configMapGenerator:
  - name: app-config
    behavior: replace
    literals:
      - ENV=production

images:
  - name: BACKEND_IMAGE
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/tictactoe-backend
    newTag: ${IMAGE_TAG}
  - name: FRONTEND_IMAGE
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/tictactoe-frontend
    newTag: ${IMAGE_TAG}

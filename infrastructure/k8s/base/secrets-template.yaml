# TEMPLATE FILE - DO NOT APPLY DIRECTLY
# Copy this file to secrets.yaml (gitignored) and fill in actual values
# For production, use sealed-secrets, external-secrets, or your preferred secrets management solution
#
# To create the secret from this template:
#   1. Copy this file: cp secrets-template.yaml secrets.yaml
#   2. Base64 encode your values: echo -n 'your-value' | base64
#   3. Replace the placeholder values with your base64-encoded values
#   4. Apply: kubectl apply -f secrets.yaml
#
# IMPORTANT: Never commit secrets.yaml to version control!
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: tictactoe
type: Opaque
data:
  # Base64 encoded connection string to PostgreSQL
  # Example: postgres://user:password@host:5432/tictactoe?sslmode=require
  DATABASE_URL: <BASE64_ENCODED_DATABASE_URL>
  # Base64 encoded connection string to Redis
  # Example: redis://:password@host:6379
  REDIS_URL: <BASE64_ENCODED_REDIS_URL>
  # Base64 encoded session secret (use a long random string, e.g., 32+ characters)
  # Generate with: openssl rand -base64 32
  SESSION_SECRET: <BASE64_ENCODED_SESSION_SECRET>
